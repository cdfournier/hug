  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ap:48px\">\n\n  <header style=\"display:flex;flex-direction:column;gap:14px;max-width:820px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#4E4856\">Brand color exploration · WCAG 2.2 AAA<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:44px;line-height:1.05;font-weight:700;letter-spacing:-.02em\">Special Violet UI family<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.55;color:#4E4856;text-wrap:pretty\">Special Violet as the primary action in light and dark modes, with 3 surfaces, a transparent secondary, and four status colors. Every text pair meets <strong style=\"color:#1C1820\">7:1<\u002Fstrong> (1.4.6). Borders and focus rings meet <strong style=\"color:#1C1820\">3:1<\u002Fstrong> (1.4.11, 2.4.13). Status hues sit well apart from violet: green, amber, red, and a blue shifted away from purple. Each status also has a glyph and a label, so it never depends on color alone (1.4.1).<\u002Fp>\n  <\u002Fheader>\n\n  <sc-for list=\"{{ families }}\" as=\"f\" hint-placeholder-count=\"2\">\n    <section id=\"{{ f.id }}\" data-screen-label=\"{{ f.name }}\" style=\"display:flex;flex-direction:column;gap:20px;scroll-margin-top:24px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:20px;justify-content:space-between\">\n        <div style=\"display:flex;align-items:center;gap:16px\">\n          <div style=\"display:flex;gap:6px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center\">\n              <div style=\"width:72px;height:72px;border-radius:16px;background:{{ f.hex }};display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:#FFFFFF;font-size:12px;font-weight:600\">{{ f.whiteRatio }}<\u002Fdiv>\n              <span style=\"font-size:11px;color:#4E4856\">Original<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ f.adjusted }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center\">\n                <div style=\"width:72px;height:72px;border-radius:16px;background:{{ f.shade }};display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:#FFFFFF;font-size:12px;font-weight:600\">{{ f.shadeRatio }}<\u002Fdiv>\n                <span style=\"font-size:11px;color:#4E4856\">AAA shade<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h2 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em\">{{ f.name }}<\u002Fh2>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E4856\">{{ f.hex }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:#4E4856;text-wrap:pretty;max-width:560px\">{{ f.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"font-size:13px;font-weight:600;color:{{ f.statusColor }}\">{{ f.status }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ f.copy }}\" style=\"font-family:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid #CFCAD6;background:#FFFFFF;color:#1C1820;cursor:pointer\" style-hover=\"background:#EEEBF2\">{{ f.copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));gap:20px\">\n        <sc-for list=\"{{ f.modes }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <div style=\"background:{{ t.canvas }};color:{{ t.textPrimary }};border:1px solid {{ t.divider }};border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:24px;min-width:0\">\n            <div style=\"font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:{{ t.textSecondary }}\">{{ t.name }} mode<\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:15px;font-weight:600\">Surfaces<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n                <sc-for list=\"{{ t.surfaces }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"background:{{ s.hex }};border:1px solid {{ t.divider }};border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:160px;min-width:0\">\n                    <div style=\"display:flex;flex-direction:column;gap:2px\">\n                      <span style=\"font-weight:600;font-size:15px;color:{{ t.textPrimary }}\">{{ s.name }}<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ t.textSecondary }}\">{{ s.hex }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;line-height:1.35;color:{{ t.textSecondary }};text-wrap:pretty\">{{ s.use }}<\u002Fdiv>\n                    <sc-if value=\"{{ showRatios }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:3px;font-size:12px;font-family:'JetBrains Mono',monospace\">\n                        <span style=\"color:{{ t.textPrimary }}\">Text {{ s.rp }}<\u002Fspan>\n                        <span style=\"color:{{ t.textSecondary }}\">Muted {{ s.rs }}<\u002Fspan>\n                        <span style=\"color:{{ t.textBrand }}\">Brand {{ s.rb }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:15px;font-weight:600\">Actions<\u002Fdiv>\n              <sc-for list=\"{{ t.actions }}\" as=\"a\" hint-placeholder-count=\"2\">\n                <div style=\"background:{{ t.surface }};border:1px solid {{ t.divider }};border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px\">\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap\">\n                    <span style=\"font-weight:600\">{{ a.name }}<\u002Fspan>\n                    <span style=\"color:{{ t.textSecondary }}\">{{ a.note }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px\">\n                    <sc-for list=\"{{ a.states }}\" as=\"st\" hint-placeholder-count=\"5\">\n                      <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                        <div style=\"background:{{ st.bg }};color:{{ st.fg }};box-shadow:{{ st.ring }};border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px\">Save<\u002Fdiv>\n                        <span style=\"font-size:11px;color:{{ t.textSecondary }};text-align:center\">{{ st.label }}<\u002Fspan>\n                        <sc-if value=\"{{ showRatios }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ t.textSecondary }};text-align:center;line-height:1.4\">{{ st.bgHex }}<br>{{ st.ratio }}<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:15px;font-weight:600\">Text &amp; lines<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px\">\n                <sc-for list=\"{{ t.tokens }}\" as=\"k\" hint-placeholder-count=\"6\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:{{ t.surface }};border:1px solid {{ t.divider }};min-width:0\">\n                    <span style=\"width:28px;height:28px;flex:none;border-radius:8px;background:{{ k.hex }};border:1px solid {{ t.divider }}\"><\u002Fspan>\n                    <div style=\"display:flex;flex-direction:column;min-width:0\">\n                      <span style=\"font-size:12px;font-weight:600\">{{ k.name }}<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ t.textSecondary }}\">{{ k.hex }} · {{ k.ratio }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:15px;font-weight:600\">Status<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ t.status }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:{{ s.subtle }};box-shadow:inset 0 0 0 1px {{ s.border }};border-radius:12px;padding:12px 14px\">\n                    <div style=\"display:flex;gap:10px;align-items:flex-start;min-width:0\">\n                      <span style=\"width:22px;height:22px;flex:none;border-radius:50%;background:{{ s.fg }};color:{{ s.subtle }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1\">{{ s.glyph }}<\u002Fspan>\n                      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                        <span style=\"font-size:14px;font-weight:600;color:{{ s.fg }}\">{{ s.name }}<\u002Fspan>\n                        <span style=\"font-size:13px;color:{{ s.fg }};text-wrap:pretty\">{{ s.msg }}<\u002Fspan>\n                        <sc-if value=\"{{ showRatios }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ s.fg }};padding-top:2px\">text {{ s.fg }} · {{ s.rText }} · border {{ s.border }} · {{ s.rBorder }}<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\">\n                      <span style=\"background:{{ s.solid }};color:{{ s.solidFg }};border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap\">{{ s.badge }}<\u002Fspan>\n                      <sc-if value=\"{{ showRatios }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ s.fg }}\">{{ s.solid }} · {{ s.rSolid }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:15px;font-weight:600\">In use<\u002Fdiv>\n              <div style=\"background:{{ t.surface }};border:1px solid {{ t.divider }};border-radius:14px;overflow:hidden\">\n                <div style=\"padding:18px 20px;display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"font-size:18px;font-weight:700\">Invite your team<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.5;color:{{ t.textSecondary }};text-wrap:pretty\">Teammates get edit access to every project in this workspace. <span style=\"color:{{ t.textBrand }};text-decoration:underline;font-weight:500\">Learn about roles<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:{{ t.subtle }};padding:16px 20px;display:flex;flex-direction:column;gap:14px;border-top:1px solid {{ t.divider }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <span style=\"font-size:13px;font-weight:600\">Email address<\u002Fspan>\n                    <div style=\"background:{{ t.surface }};border:1.5px solid {{ t.border }};border-radius:10px;height:44px;padding:0 14px;display:flex;align-items:center;font-size:14px;color:{{ t.textSecondary }}\">name@company.com<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap\">\n                    <div style=\"background:transparent;color:{{ t.secFg }};box-shadow:inset 0 0 0 1.5px {{ t.secBorder }};border-radius:10px;height:44px;padding:0 18px;display:flex;align-items:center;font-weight:600;font-size:14px\">Cancel<\u002Fdiv>\n                    <div style=\"background:{{ t.priBg }};color:{{ t.priFg }};box-shadow:{{ t.priRing }};border-radius:10px;height:44px;padding:0 18px;display:flex;align-items:center;font-weight:600;font-size:14px\">Send invite<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;statusSet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Brand-tinted&quot;,&quot;Harmonized&quot;,&quot;Standard&quot;],&quot;default&quot;:&quot;Brand-tinted&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Both modes&quot;,&quot;Light only&quot;,&quot;Dark only&quot;],&quot;default&quot;:&quot;Both modes&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showRatios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst toLin=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)};\nconst fromLin=c=>c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;\nconst hexRgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};\nfunction toOklch(hex){let [r,g,b]=hexRgb(hex).map(toLin);\n  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);\n  const L=0.2104542553*l+0.7936177850*m-0.0040720468*s,A=1.9779984951*l-2.4285922050*m+0.4505937099*s,B=0.0259040371*l+0.7827717662*m-0.8086757660*s;\n  return [L,Math.hypot(A,B),(Math.atan2(B,A)*180/Math.PI+360)%360];}\nfunction linRgb(L,C,h){const a=C*Math.cos(h*Math.PI/180),b=C*Math.sin(h*Math.PI/180);\n  const l=(L+0.3963377774*a+0.2158037573*b)**3,m=(L-0.1055613458*a-0.0638541728*b)**3,s=(L-0.0894841775*a-1.2914855480*b)**3;\n  return [4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s];}\nfunction ok(L,C,h){L=Math.max(0,Math.min(1,L));const inG=v=>v.every(x=>x>=-1e-4&&x<=1.0001);let rgb=linRgb(L,C,h);\n  if(!inG(rgb)){let lo=0,hi=C;for(let i=0;i<22;i++){const mid=(lo+hi)/2;if(inG(linRgb(L,mid,h)))lo=mid;else hi=mid;}rgb=linRgb(L,lo,h);}\n  return '#'+rgb.map(x=>Math.round(Math.max(0,Math.min(1,fromLin(Math.max(0,x))))*255).toString(16).padStart(2,'0')).join('').toUpperCase();}\nconst lum=hex=>{const [r,g,b]=hexRgb(hex).map(toLin);return 0.2126*r+0.7152*g+0.0722*b};\nconst ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05)};\nfunction fit(L,C,h,test,dir){let hex=ok(L,C,h);for(let i=0;i<220&&!test(hex);i++){L+=dir*0.005;hex=ok(L,C,h);}return {hex,L};}\nconst fmt=r=>(Math.floor(r*100)/100).toFixed(2)+':1';\n\nconst SWATCHES=[{name:'Special Violet',hex:'#632E9D'}];\nconst STATUS_SETS={};\nSTATUS_SETS.Standard=[\n  {name:'Success',h:150,c:.13,glyph:'✓',badge:'Paid',msg:'Your changes were saved.'},\n  {name:'Warning',h:75,c:.15,lightFill:true,glyph:'!',badge:'Due soon',msg:'Your trial ends in 3 days.'},\n  {name:'Error',h:27,c:.17,glyph:'×',badge:'Failed',msg:'Payment failed. Check your card details.'},\n  {name:'Info',h:245,c:.12,glyph:'i',badge:'New',msg:'A new version is available.'}];\nSTATUS_SETS['Brand-tinted']=[\n  {name:'Success',h:188,c:.07,glyph:'✓',badge:'Paid',msg:'Your changes were saved.'},\n  {name:'Warning',h:55,c:.09,lightFill:true,glyph:'!',badge:'Due soon',msg:'Your trial ends in 3 days.'},\n  {name:'Error',h:6,c:.13,glyph:'×',badge:'Failed',msg:'Payment failed. Check your card details.'},\n  {name:'Info',h:282,c:.08,glyph:'i',badge:'New',msg:'A new version is available.'}];\nSTATUS_SETS.Harmonized=[\n  {name:'Success',h:172,c:.085,glyph:'✓',badge:'Paid',msg:'Your changes were saved.'},\n  {name:'Warning',h:62,c:.105,lightFill:true,glyph:'!',badge:'Due soon',msg:'Your trial ends in 3 days.'},\n  {name:'Error',h:14,c:.135,glyph:'×',badge:'Failed',msg:'Payment failed. Check your card details.'},\n  {name:'Info',h:268,c:.09,glyph:'i',badge:'New',msg:'A new version is available.'}];\n\nfunction build(sw,STATUS){\n  const [L0,C0,h]=toOklch(sw.hex);const W='#FFFFFF';const checks=[];\n  const chk=(a,b,t)=>{const r=ratio(a,b);checks.push(r>=t-1e-9);return fmt(r)};\n  const ring=(gap,c)=>`0 0 0 2px ${gap}, 0 0 0 4px ${c}`;\n  const whiteOk=ratio(sw.hex,W)>=7;\n  // LIGHT\n  const lc=ok(.975,.008,h),ls=ok(.997,.003,h),lr=ok(.945,.02,h);\n  const ltp=fit(.22,.05,h,x=>ratio(x,lr)>=7,-1).hex;\n  const lts=fit(.45,.04,h,x=>ratio(x,lr)>=7,-1).hex;\n  const p=whiteOk?{hex:sw.hex,L:L0}:fit(L0,C0,h,x=>ratio(x,W)>=7,-1);\n  const lpH=ok(p.L-.04,C0,h),lpP=ok(p.L-.08,C0,h);\n  const ltb=fit(p.L,C0,h,x=>ratio(x,lr)>=7,-1).hex;\n  const lT=ok(.94,.045,h),lTP=ok(.9,.06,h);\n  const lsF=fit(p.L,C0,h,x=>ratio(x,lTP)>=7&&ratio(x,lr)>=7,-1).hex;\n  const lbd=fit(.62,.03,h,x=>ratio(x,lr)>=3,-1).hex, ldv=ok(.9,.015,h);\n  const light={name:'Light',canvas:lc,surface:ls,subtle:lr,textPrimary:ltp,textSecondary:lts,textBrand:ltb,border:lbd,divider:ldv,\n    priBg:p.hex,priFg:W,priRing:'none',secFg:lsF,secBorder:lbd,\n    surfaces:[{name:'Canvas',hex:lc,use:'App background'},{name:'Surface',hex:ls,use:'Cards, sheets, dialogs'},{name:'Subtle',hex:lr,use:'Inputs, wells, selected rows'}],\n    actions:[\n      {name:'Primary',note:whiteOk?'Swatch used as-is':'AAA shade of '+sw.hex,states:[\n        {label:'Default',bg:p.hex,bgHex:p.hex,fg:W,ring:'none',ratio:chk(W,p.hex,7)},\n        {label:'Hover',bg:lpH,bgHex:lpH,fg:W,ring:'none',ratio:chk(W,lpH,7)},\n        {label:'Pressed',bg:lpP,bgHex:lpP,fg:W,ring:'none',ratio:chk(W,lpP,7)},\n        {label:'Focus',bg:p.hex,bgHex:'ring '+ltb,fg:W,ring:ring(ls,ltb),ratio:chk(ltb,ls,3)},\n        {label:'Disabled',bg:lr,bgHex:lr,fg:ok(.62,.02,h),ring:'none',ratio:'exempt'}]},\n      {name:'Secondary',note:'Transparent, fills with a swatch tint',states:[\n        {label:'Default',bg:'transparent',bgHex:'transparent',fg:lsF,ring:'inset 0 0 0 1.5px '+lbd,ratio:chk(lsF,lr,7)},\n        {label:'Hover',bg:lT,bgHex:lT,fg:lsF,ring:'none',ratio:chk(lsF,lT,7)},\n        {label:'Pressed',bg:lTP,bgHex:lTP,fg:lsF,ring:'none',ratio:chk(lsF,lTP,7)},\n        {label:'Focus',bg:'transparent',bgHex:'ring '+ltb,fg:lsF,ring:'inset 0 0 0 1.5px '+lbd+', '+ring(ls,ltb),ratio:chk(ltb,ls,3)},\n        {label:'Disabled',bg:'transparent',bgHex:'transparent',fg:ok(.62,.02,h),ring:'inset 0 0 0 1.5px '+ldv,ratio:'exempt'}]}],\n    tokens:[{name:'Text primary',hex:ltp,ratio:chk(ltp,lr,7)},{name:'Text secondary',hex:lts,ratio:chk(lts,lr,7)},{name:'Brand text',hex:ltb,ratio:chk(ltb,lr,7)},\n      {name:'Control border',hex:lbd,ratio:chk(lbd,lr,3)},{name:'Focus ring',hex:ltb,ratio:chk(ltb,lr,3)},{name:'Divider',hex:ldv,ratio:'decorative'}]};\n  // DARK\n  const dc=ok(.16,.03,h),ds=ok(.21,.04,h),dr=ok(.27,.05,h);\n  const dtp=fit(.97,.01,h,x=>ratio(x,dr)>=7,1).hex;\n  const dts=fit(.8,.03,h,x=>ratio(x,dr)>=7,1).hex;\n  const dC=Math.min(C0,.14);\n  const dpB=ok(.84,dC,h),dpH=ok(.88,dC,h),dpP=ok(.8,dC,h);\n  const dpF=fit(.22,.07,h,x=>ratio(x,dpP)>=7,-1).hex;\n  const dtb=fit(.8,dC,h,x=>ratio(x,dr)>=7,1).hex;\n  const daH=ok(p.L-.04,C0,h),daP=ok(p.L-.08,C0,h),daRing=fc=>'inset 0 0 0 1.5px '+dtb+(fc?', 0 0 0 2px '+ds+', 0 0 0 4px '+dtb:'');\n  const dbd=fit(.5,.04,h,x=>ratio(x,dr)>=3,1).hex, ddv=ok(.33,.04,h);\n  const dark={name:'Dark',canvas:dc,surface:ds,subtle:dr,textPrimary:dtp,textSecondary:dts,textBrand:dtb,border:dbd,divider:ddv,\n    priBg:p.hex,priFg:W,priRing:daRing(),secFg:dtb,secBorder:dbd,\n    surfaces:[{name:'Canvas',hex:dc,use:'App background'},{name:'Surface',hex:ds,use:'Cards, sheets, dialogs'},{name:'Subtle',hex:dr,use:'Inputs, raised panels, selected rows'}],\n    actions:[\n      {name:'Primary',note:'Same swatch, light outline for edge definition',states:[\n        {label:'Default',bg:p.hex,bgHex:p.hex,fg:W,ring:daRing(),ratio:chk(W,p.hex,7)},\n        {label:'Hover',bg:daH,bgHex:daH,fg:W,ring:daRing(),ratio:chk(W,daH,7)},\n        {label:'Pressed',bg:daP,bgHex:daP,fg:W,ring:daRing(),ratio:chk(W,daP,7)},\n        {label:'Focus',bg:p.hex,bgHex:'ring '+dtb,fg:W,ring:daRing(true),ratio:chk(dtb,ds,3)},\n        {label:'Disabled',bg:dr,bgHex:dr,fg:ok(.5,.03,h),ring:'none',ratio:'exempt'}]},\n      {name:'Secondary',note:'Transparent, fills with a light tint',states:[\n        {label:'Default',bg:'transparent',bgHex:'transparent',fg:dtb,ring:'inset 0 0 0 1.5px '+dbd,ratio:chk(dtb,dr,7)},\n        {label:'Hover',bg:dpB,bgHex:dpB,fg:dpF,ring:'none',ratio:chk(dpF,dpB,7)},\n        {label:'Pressed',bg:dpP,bgHex:dpP,fg:dpF,ring:'none',ratio:chk(dpF,dpP,7)},\n        {label:'Focus',bg:'transparent',bgHex:'ring '+dtb,fg:dtb,ring:'inset 0 0 0 1.5px '+dbd+', 0 0 0 2px '+ds+', 0 0 0 4px '+dtb,ratio:chk(dtb,ds,3)},\n        {label:'Disabled',bg:'transparent',bgHex:'transparent',fg:ok(.5,.03,h),ring:'inset 0 0 0 1.5px '+ddv,ratio:'exempt'}]}],\n    tokens:[{name:'Text primary',hex:dtp,ratio:chk(dtp,dr,7)},{name:'Text secondary',hex:dts,ratio:chk(dts,dr,7)},{name:'Brand text',hex:dtb,ratio:chk(dtb,dr,7)},\n      {name:'Control border',hex:dbd,ratio:chk(dbd,dr,3)},{name:'Focus ring',hex:dtb,ratio:chk(dtb,dr,3)},{name:'Divider',hex:ddv,ratio:'decorative'}]};\n  const mk=(isDark,surf)=>STATUS.map(s=>{let subtle,fg,border,solid,solidFg;\n    if(!isDark){subtle=ok(.955,.035,s.h);fg=fit(.42,s.c,s.h,x=>ratio(x,subtle)>=7&&ratio(x,surf)>=7,-1).hex;\n      border=fit(.66,s.c*.8,s.h,x=>ratio(x,surf)>=3&&ratio(x,subtle)>=3,-1).hex;\n      if(s.lightFill){solid=ok(.84,s.c,s.h);solidFg=fit(.26,.06,s.h,x=>ratio(x,solid)>=7,-1).hex;}\n      else{solid=fit(.5,s.c,s.h,x=>ratio(x,W)>=7,-1).hex;solidFg=W;}}\n    else{subtle=ok(.26,.045,s.h);fg=fit(.85,s.c*.7,s.h,x=>ratio(x,subtle)>=7&&ratio(x,surf)>=7,1).hex;\n      border=fit(.52,s.c*.7,s.h,x=>ratio(x,subtle)>=3&&ratio(x,surf)>=3,1).hex;\n      solid=ok(.82,s.c*.8,s.h);solidFg=fit(.25,.06,s.h,x=>ratio(x,solid)>=7,-1).hex;}\n    return {...s,subtle,fg,border,solid,solidFg,rText:chk(fg,subtle,7),rBorder:chk(border,surf,3),rSolid:chk(solidFg,solid,7)};});\n  light.status=mk(false,ls);dark.status=mk(true,ds);\n  // surface text ratios\n  [light,dark].forEach(t=>t.surfaces.forEach(s=>{s.rp=chk(t.textPrimary,s.hex,7);s.rs=chk(t.textSecondary,s.hex,7);s.rb=chk(t.textBrand,s.hex,7);}));\n  const pass=checks.every(Boolean);\n  const css=[light,dark].map(t=>{const m=t.name.toLowerCase();const v={canvas:t.canvas,surface:t.surface,subtle:t.subtle,'text-primary':t.textPrimary,'text-secondary':t.textSecondary,'text-brand':t.textBrand,\n    'border-control':t.border,divider:t.divider,'focus-ring':t.textBrand};\n    t.actions.forEach(a=>{const n=a.name.toLowerCase();a.states.slice(0,3).forEach(s=>{const sfx=s.label==='Default'?'':'-'+s.label.toLowerCase();v[n+'-bg'+sfx]=s.bg;v[n+'-fg'+sfx]=s.fg;});});\n    v['secondary-border']=t.secBorder;\n    t.status.forEach(s=>{const n=s.name.toLowerCase();v[n+'-fg']=s.fg;v[n+'-bg-subtle']=s.subtle;v[n+'-border']=s.border;v[n+'-bg-strong']=s.solid;v[n+'-fg-on-strong']=s.solidFg;});\n    return `/* ${sw.name} · ${m} */\\n`+Object.entries(v).map(([k,x])=>`--${m}-${k}: ${x};`).join('\\n');}).join('\\n\\n');\n  return {id:sw.name.toLowerCase().replace(/\\s+/g,'-'),name:sw.name,hex:sw.hex,whiteRatio:fmt(ratio(sw.hex,W)),adjusted:!whiteOk,shade:p.hex,shadeRatio:fmt(ratio(p.hex,W)),\n    note:whiteOk?`Passes 7:1 with white text, so it's used unchanged as the light-mode primary.`:`Only ${fmt(ratio(sw.hex,W))} with white text. The light-mode primary darkens to ${p.hex} to reach 7:1. Keep ${sw.hex} for brand moments.`,\n    status:pass?`All ${checks.length} pairs pass AAA`:'Some pairs fail',statusColor:pass?'#1E6B3A':'#A3122A',light,dark,css};\n}\n\nclass Component extends DCLogic {\n  state={copied:null};\n\n  renderVals(){\n    const set=this.props.statusSet??'Brand-tinted';if(this._set!==set){this._set=set;this.fams=SWATCHES.map(s=>build(s,STATUS_SETS[set]||STATUS_SETS.Harmonized));}const fams=this.fams;\n    const view=this.props.view??'Both modes';\n    return {showRatios:this.props.showRatios??true,\n      families:fams.map(f=>({...f,\n        modes:view==='Light only'?[f.light]:view==='Dark only'?[f.dark]:[f.light,f.dark],\n        copyLabel:this.state.copied===f.id?'Copied':'Copy CSS tokens',\n        copy:()=>{navigator.clipboard?.writeText(f.css);this.setState({copied:f.id});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({copied:null}),1600);}}))};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
